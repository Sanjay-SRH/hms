spring:
  application:
    name: hms-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/hms
    username: hms_user
    password: hms_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mongodb:
    uri: mongodb://localhost:27017/hms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-1234}
    expiration-minutes: 60
  bootstrap:
    admin-password: ${ADMIN_PASSWORD:Admin@12345}