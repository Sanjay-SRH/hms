services:
  progress:
    image: postgres:16
    container_name: hms-postgres
    environment: 
      POSTGRES_DB: hms
      POSTGRES_USER: hms_user
      POSTGRES_PASSWORD: hms_password
    ports: 
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data


  mongo:
    image: mongo:7
    container_name: hms-mongo
    ports: 
      - "27017:27017"
    volumes: 
      - mongodata:/data/db


volumes:
  pgdata:
  mongodata:
